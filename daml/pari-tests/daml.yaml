sdk-version: 3.5.12
name: pari-tests
source: daml
version: 0.2.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../pari/.daml/dist/pari-0.2.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-request-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../dars/splice-test-token-v1-1.0.0.dar
build-options:
  - --target=2.1
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
# The hundred-lender scale test returns a ledger trace larger than the script
# service's default message limit.
script-service:
  grpc-max-message-size: 536870912
  jvm-options: [-Xmx2G]
