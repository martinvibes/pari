[package]
name = "pari-test-usdc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Test USDC for the Pari demo: a NEP-141 token anyone can mint"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
