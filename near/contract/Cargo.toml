[package]
name = "pari-ledger"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pari's rules contract: who may do what, and how much money may ever leave"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
